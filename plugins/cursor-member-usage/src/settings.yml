strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: post
framework_version: latest
serverless_language:
polling_url: https://api.cursor.com/teams/filtered-usage-events
# Cursor's Admin API uses HTTP Basic with the key as the username and an empty
# password (`curl -u KEY:`), not a Bearer token.
#
# The `replace: '=', '%3D'` is load-bearing. This string is parsed by splitting
# on '&' then '=', keeping only the first two fields, then URL-decoding the
# value — so base64 padding would be silently truncated and the credential
# corrupted. Escaping just the '=' sidesteps the delimiter collision. '+' and
# '/' need no escaping: the decoder is unescape_uri_component, which (unlike
# CGI.unescape) leaves '+' alone.
polling_headers: "authorization=Basic%20{{ cursor_api_key | append: ':' | base64_encode | replace: '=', '%3D' }}&content-type=application/json"
# One member, calendar month to date. startDate/endDate are required, in epoch
# milliseconds. pageSize is Cursor's documented maximum; transform.js flags the
# result as truncated if a member exceeds it.
polling_body: >-
  {"email": "{{ cursor_member_email }}",
  "startDate": {{ 'now' | date: '%Y-%m-01' | date: '%s' | times: 1000 }},
  "endDate": {{ 'now' | date: '%s' | times: 1000 }},
  "page": 1,
  "pageSize": 1000}
id:
custom_fields:
- keyname: author_bio
  name: About This Plugin
  field_type: author_bio
  description: One teammate's Cursor AI spend.
  github_url: https://github.com/NickSpaghetti/trmnl-cursor-usage
  learn_more_url: https://cursor.com/dashboard
  email_address: nickspaghettidev@gmail.com
  category: programming,productivity
- keyname: cursor_api_key
  field_type: password
  name: Cursor Admin API Key
  description: Found at cursor.com/dashboard → Settings → Cursor Admin API Keys
  placeholder: cursor_...
  optional: false
- keyname: cursor_member_email
  field_type: string
  name: Member Email
  description: The team member whose usage this dashboard displays
  placeholder: name@company.com
  optional: false
- keyname: cursor_member_budget_dollars
  field_type: number
  name: Personal Budget ($)
  description: Soft monthly budget in dollars — used for the personal spend meter
  placeholder: 25
  default: 25
  optional: false
name: Cursor Member Usage
refresh_interval: 60
